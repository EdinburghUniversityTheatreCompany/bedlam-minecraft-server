name: bedlam-minecraft-server

services:
  minecraft:
    image: bedlamtheatre/minecraft-server
    volumes:
      - type: volume
        source: minecraft-data
        target: /data
    ports:
      - "25565:25565" # Main
      - "25575:25575" # RCON
      - "19132:19132/udp" # Geyser
    environment:
      - "GITHUB_TOKEN=${GITHUB_TOKEN}"
      - "EULA=${EULA}"
    stdin_open: true
    tty: true
    pull_policy: never
    restart: unless-stopped
  sftp-server:
    image: atmoz/sftp:alpine
    command: "${SFTP_USER:-anonymous}:${SFTP_PASS:-}:::data"
    volumes:
      - type: volume
        source: minecraft-data
        target: "/home/${SFTP_USER}/data"
    ports:
      - "25522:22"
    restart: unless-stopped
volumes:
  minecraft-data:
    name: minecraft-data
    external: true
