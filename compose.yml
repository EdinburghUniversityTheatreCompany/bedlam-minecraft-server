name: bedlam-minecraft-server

services:
  minecraft:
    image: bedlamtheatre/minecraft-server
    volumes:
      - type: volume
        source: minecraft-data
        target: /data
    ports:
      - "25565:25565" # Main
      - "25575:25575" # RCON
      - "19132:19132/udp" # Geyser
    environment:
      - "GITHUB_TOKEN=${GITHUB_TOKEN}"
      - "EULA=${EULA}"
    stdin_open: true
    tty: true
    pull_policy: never
    restart: unless-stopped
  sftp-server:
    image: rclone/rclone
    command: serve sftp /data --addr :25522 --user=${SFTP_USER} --pass=${SFTP_PASS}
    volumes:
      - type: volume
        source: minecraft-data
        target: /data
    ports:
      - "25522:25522"
    restart: unless-stopped
    environment:
      - "SFTP_USER=${SFTP_USER:-anonymous}"
      - "SFTP_PASS=${SFTP_PASS:-\"\"}"
volumes:
  minecraft-data:
    name: minecraft-data
    external: true
